# Home Assistant Quality Scale
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling: done
  brands: todo
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing but the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  config-entry-unloading: done
  log-when-unavailable: done
  entity-unavailable: done
  action-exceptions:
    status: exempt
    comment: The integration registers no actions.
  reauthentication-flow:
    status: exempt
    comment: Modbus TCP has no authentication.
  parallel-updates: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: todo
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One config entry addresses exactly one inverter.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No situation needs the user's intervention beyond reconfiguring.
  stale-devices:
    status: exempt
    comment: One config entry addresses exactly one inverter; removing it removes the device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The Modbus unit is provided by the core modbus integration; there is no web session.
  strict-typing: done
